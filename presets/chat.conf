# An example preset: the settings for something going into a chat or a ticket, where small and
# short matters more than sharp. Use it with --preset chat, or give it its own right-click entry:
#
#     shrinkit preset install chat
#
# Copy this file to make your own. Anything you leave out keeps whatever settings.conf says.

speed = 2
crf = 32
trim_idle = true
max_height = 1080
